name: Clean clone verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: code
    steps:
      - name: Check out tracked repository files
        uses: actions/checkout@v7

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          cache: 'pip'
          cache-dependency-path: |
            code/pyproject.toml
            code/requirements-repro.txt

      - name: Install exact direct environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          python -m pip install -r requirements-repro.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Audit tracked release evidence
        run: python -m experiments.repository_release --repo-root ..

      - name: Audit canonical source-to-results graph
        run: python -m experiments.reproduce_source --audit-only --report .rebuild/ci_source_audit.json

      - name: Validate notebook reproduction entrypoint
        run: python -m experiments.reproduce_notebooks --help

      - name: Run tracked clean-clone suite
        run: python -m pytest -q -p no:cacheprovider --clean-clone --basetemp="${RUNNER_TEMP}/pytest-reproducibility"
