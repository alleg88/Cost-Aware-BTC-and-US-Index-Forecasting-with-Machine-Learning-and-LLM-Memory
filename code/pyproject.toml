[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-aware-market-forecasting"
version = "0.1.0"
description = "Ensemble ML + LLM sentiment for short-horizon market-direction prediction"
requires-python = ">=3.11"

# Core dependencies — enough to run the RQ1 model zoo (incl. torch deep models on CPU),
# the notebooks, and the tests. For GPU training install the CUDA wheel instead:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128 --force-reinstall --no-deps
dependencies = [
    "pandas==3.0.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyarrow==24.0.0",
    "scikit-learn==1.9.0",
    "catboost==1.2.10",
    "xgboost==3.2.0",
    "torch==2.13.0",
    "requests==2.34.2",
    "matplotlib==3.11.0",
    "pyyaml==6.0.3",
    "tqdm==4.68.3",
    "rapidfuzz==3.14.3",
    "pytest==9.1.1",
]

# Later-phase deps (LLM sentiment scoring, tuning). Install with: pip install -e .[extras]
[project.optional-dependencies]
extras = [
    "optuna==4.9.0",
    "transformers==5.14.1",
    "sentencepiece==0.2.2",
    "protobuf==7.35.1",
    "sentence-transformers==5.7.0",
    "ollama==0.6.2",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
]
acquisition = [
    "google-cloud-bigquery==3.44.0",
]

# The project's importable top-level modules (so `import features`, `import models`, … work
# from any working directory once installed with `pip install -e .`).
[tool.setuptools]
py-modules = ["conftest"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "data",
    "features",
    "evaluation",
    "models",
    "sentiment",
    "experiments",
    "memory",
    "ensemble",
    "reflection_agent",
    "reflection_agent.*",
]
namespaces = true
